[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthsphere-ehr"
version = "1.0.0"
description = "Enterprise Healthcare Information & Clinical EHR Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Clinical Engineering Team", email = "engineering@healthsphere-systems.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
healthsphere = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
source = ["core", "domain", "services", "repositories", "cdss", "clinical_guidelines", "hl7", "edi_x12", "telemetry", "inpatient", "knowledge_base"]
omit = ["tests/*", "venv/*", ".git/*"]
